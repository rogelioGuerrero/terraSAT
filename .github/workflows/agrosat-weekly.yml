name: AgroSAT — Boletín semanal

# Pipeline automatizado: Sentinel-2 (CDSE) + Open-Meteo -> LLM (Groq) ->
# mapa Leaflet -> screenshot -> branding -> Facebook.
# El path manual local es el mismo set de comandos (ver README), y sirve de
# fallback si el job falla (p.ej. FB_PAGE_ACCESS_TOKEN expirado).

on:
  schedule:
    - cron: "0 12 * * 1"   # lunes 12:00 UTC (~08:00-09:00 Paraguay)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generar todo pero NO publicar en Facebook"
        type: boolean
        default: true

env:
  CDSE_USERNAME: ${{ secrets.CDSE_USERNAME }}
  CDSE_PASSWORD: ${{ secrets.CDSE_PASSWORD }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
  FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
  PUBLISH_WEBHOOK_URL: ${{ secrets.PUBLISH_WEBHOOK_URL }}
  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
  NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
  APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
  APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
  APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
  APPWRITE_DATABASE_ID: ${{ secrets.APPWRITE_DATABASE_ID }}

jobs:
  boletin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dependencias Python (sin instalar el paquete local)
        run: uv sync --no-install-project

      - name: Dependencias Node (sharp, etc.)
        run: npm ci

      - name: Boletín con datos reales (CDSE + Open-Meteo + Groq)
        run: uv run --no-sync python nooa-agent/demo_alerta_temprana_regional.py

      # ForestSAT + UrbanSAT — mismo colector multi-producto (datos reales
      # CDSE, clasificadores por dominio) + artículo por fases. Los informes
      # se publican a la SPA más abajo vía publish-informe.mjs --product.
      - name: ForestSAT — colector + artículo (CDSE + Groq)
        run: |
          uv run --no-sync python nooa-agent/agro_real_data.py --product forest
          uv run --no-sync python nooa-agent/article_pipeline.py --product forest

      - name: UrbanSAT — colector + artículo (CDSE + Groq)
        run: |
          uv run --no-sync python nooa-agent/agro_real_data.py --product urban
          uv run --no-sync python nooa-agent/article_pipeline.py --product urban

      - name: Mapa Leaflet (lee scripts/agro-zones.json)
        run: uv run --no-sync python nooa-agent/generate_map.py

      - name: Screenshot del mapa (Playwright headless)
        run: |
          npx -y playwright@1.55.0 install --with-deps chromium
          npx -y playwright@1.55.0 screenshot \
            --viewport-size=1280,860 --wait-for-timeout=8000 \
            "file://$PWD/scripts/agrosat-map.html" \
            scripts/agrosat-map-screenshot.png

      - name: Foto de cultivo (Pexels — reemplaza imagen Gemini manual)
        run: |
          node scripts/fetch-pexels-photo.mjs \
            "dry agriculture field aerial" \
            --output scripts/agrosat-pexels-photo.jpg

      - name: Combinar foto + mapa
        run: |
          node scripts/combine-images.mjs \
            scripts/agrosat-pexels-photo.jpg \
            scripts/agrosat-map-screenshot.png \
            --output scripts/agrosat-combined.jpg

      - name: Branding TerraSAT + período
        run: |
          PERIOD="$(date -d '6 days ago' +%d/%m) – $(date +%d/%m/%Y)"
          node scripts/add-branding-terrasat.mjs \
            scripts/agrosat-combined.jpg --period "$PERIOD"

      # Publicación: la app Meta no puede obtener pages_read_engagement sin
      # App Review, así que la única vía automática es un webhook de
      # Make.com/Zapier (su app ya está autorizada). Sin secret configurado,
      # el job genera todo y queda para publicación manual desde artefactos.
      - name: Publicar en Facebook (webhook)
        if: (github.event_name == 'schedule' || inputs.dry_run != true) && env.PUBLISH_WEBHOOK_URL != ''
        run: |
          node scripts/post-webhook.mjs \
            scripts/agrosat-combined_branded.jpg \
            @scripts/generated-article-social.txt

      - name: Sin canal de publicación — post manual
        if: (github.event_name == 'schedule' || inputs.dry_run != true) && env.PUBLISH_WEBHOOK_URL == ''
        run: |
          echo "::notice::Sin PUBLISH_WEBHOOK_URL — publicar manualmente: bajar el artefacto agrosat-boletin y subir agrosat-combined_branded.jpg + generated-article-social.txt a la página de Facebook."

      - name: Dry-run (dispatch sin publicación)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: |
          if [ -n "$PUBLISH_WEBHOOK_URL" ]; then
            node scripts/post-webhook.mjs \
              scripts/agrosat-combined_branded.jpg \
              @scripts/generated-article-social.txt --dry-run
          else
            node scripts/fb-post.mjs \
              scripts/agrosat-combined_branded.jpg \
              @scripts/generated-article-social.txt --dry-run
          fi

      # --- Web: informes nuevos en la SPA + deploy a Netlify ---
      # publish-informe.mjs genera título/excerpt (Groq), foto+video (Pexels)
      # y prepende la entrada a informes.json. Idempotente por período+producto.
      - name: Informes para la SPA (agro + forest + urban)
        run: |
          node scripts/publish-informe.mjs --product agro
          node scripts/publish-informe.mjs --product forest
          node scripts/publish-informe.mjs --product urban

      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build

      # Commitea los archivos generados para que repo y sitio no diverjan.
      # Solo rutas de artefactos — nunca toca código ni secretos.
      - name: Commit de artefactos generados
        run: |
          git config user.name "agrosat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/data/informes.json
          git add "scripts/*-zones.json" "scripts/generated-article*.txt" 2>/dev/null || true
          git add "web/src/assets/informe-*" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios nuevos en informes"
          else
            git commit -m "chore: informes semanales auto-generados [skip ci]"
            git push
          fi

      - name: Deploy a Netlify
        if: env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        run: npx --yes netlify-cli@23 deploy --dir=web/dist --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --prod

      - name: Artefactos generados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agrosat-boletin-${{ github.run_id }}
          path: |
            scripts/agro-zones.json
            scripts/forest-zones.json
            scripts/urban-zones.json
            scripts/generated-article.txt
            scripts/generated-article-social.txt
            scripts/generated-article-forest.txt
            scripts/generated-article-forest-social.txt
            scripts/generated-article-urban.txt
            scripts/generated-article-urban-social.txt
            scripts/agrosat-map.html
            scripts/agrosat-map-screenshot.png
            scripts/agrosat-pexels-photo.jpg
            scripts/agrosat-combined.jpg
            scripts/agrosat-combined_branded.jpg
          retention-days: 90
