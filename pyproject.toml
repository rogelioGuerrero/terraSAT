[project]
name = "terrasat"
version = "0.1.0"
description = "TerraSAT — Procesamiento de imágenes satelitales (AgroSAT + UrbanSAT)"
readme = "README.md"
authors = [
    { name = "rogelioGuerrero", email = "rogelioGuerrero@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "folium>=0.20.0",
    "httpx>=0.28.1",
    "litellm>=1.96.0",
    "python-dotenv>=1.2.2",
    "requests>=2.32.0",
]

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
